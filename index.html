<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品集 | Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#/" class="nav-logo" id="nav-logo">Portfolio</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="#/" class="nav-link" data-route="home">首页</a></li>
        <li class="nav-dropdown">
          <a href="javascript:void(0)" class="nav-link">作品分类 ▾</a>
          <ul class="dropdown-menu" id="category-dropdown"></ul>
        </li>
        <li><a href="#/about" class="nav-link" data-route="about">关于我</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main id="app"></main>

  <!-- 图片灯箱 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">✕</button>
    <button class="lightbox-prev" id="lightbox-prev">‹</button>
    <img class="lightbox-image" id="lightbox-image" src="" alt="">
    <button class="lightbox-next" id="lightbox-next">›</button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-container">
      <p id="footer-text">© 2024 个人作品集. All rights reserved.</p>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
